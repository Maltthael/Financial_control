<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/categoria.css">
 </head>

<body class="teste">  
    <h1>Pagina de registro de categorias</h1>
    <a href="/transacoes">Transacoes</a>
    <button id="btnAbrir">Criar nova categoria</button>


    <table>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>

        {% for i in categoria %}
        <tr>
            <td>{{ i.nome }}</td>
            <td><a href="/categorias/deletar/{{ i.id }}">Excluir</a></td>
            <td><button id="btnAbrir">Editar</button></td>
        </tr>

        {% endfor %}

    </table>




    <div id="modalCategoria" class="div_desaparecer_categoria">
        <div class="form_categoria">
            <form id="formCategoria">
                <h2>Criar categoria</h2>
                <input type="hidden" name="categoria_id_hidden" value="">
                <input type="hidden" id="categoria_id_hidden" name="categoria_id_hidden" value="">
                <input type="hidden" id="editar" value="">
                <input id="nome" placeholder="Nome" required>
                <button type="submit" id="btnFechar">Salvar</button>
                <button id="btnCancelar">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="/static/scripts_categorias.js" defer></script>
</body>

</html>
